<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảm Ơn Bạn - Chúc Mừng Trung Thu</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
    
        :root {
            --primary-color: #0f1c3f; 
            --accent-color: #ff9800;  
            --bg-cream: #fffdf5;      
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-cream);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .thanks-card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            border-top: 8px solid var(--accent-color);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .moon-icon {
            font-size: 50px;
            margin-bottom: 20px;
            display: block;
        }

        .btn-back {
            display: inline-block;
            text-decoration: none;
            background-color: var(--primary-color);
            color: var(--accent-color);
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
            border: 2px solid var(--primary-color);
        }

        .btn-back:hover {
            background-color: transparent;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="thanks-card">
        <span class="moon-icon">🌕</span>
        <h1>Cảm Ơn Bạn!</h1>
        <p>
            Lời chúc Trung Thu của bạn đã được gửi đi thành công.<br>
            Chúc bạn và gia đình một mùa trăng rằm trọn vẹn, 
            ấm áp và đong đầy hạnh phúc.
        </p>
        <a href="index.html" class="btn-back">Quay lại Trang chủ</a>
    </div>

</body>
</html>
